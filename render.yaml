services:
  - type: web
    name: upgrade-planner-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./server/UpgradePlanner.Api/Dockerfile
    dockerContext: ./server/UpgradePlanner.Api
    envVars:
      - key: SeedDemoData
        value: "true"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Update this after your Vercel deploy exists, to your actual
      # Vercel URL (e.g. https://upgrade-planner.vercel.app). Comma-separate
      # multiple origins if needed.
      - key: AllowedOrigins
        value: https://REPLACE-WITH-YOUR-VERCEL-URL.vercel.app
